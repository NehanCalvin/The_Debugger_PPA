<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <link rel="stylesheet" href="empDets.css">
</head>
<body>
<style>
     #searchBox {
    position: fixed;
    top: 20px;
    left: 250px;
    width: calc(100% - 270px);
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    background: #333;
    color: #fff;
    outline: none;
    margin-bottom: 20px;
    box-shadow: 0 0 0 1px #444 inset;
  }
  
</style>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="empDetails.html" class="active">Employee details</a>
        <a href="employee.html">Add Employee</a>
        <!-- <a href="ManageEmp.html">Manage Employees</a> -->
        <a href="EmpReport.html">Reports</a>
        <a href="admin.html" class="dashboard-btn">Dashboard</a>
    </div>

     

    <!-- Main Content -->
    <div class="main-content">
        <input type="text" id="searchBox" placeholder="🔍 Search by Employee Name..." />
        <br>
        <br>
        <h1>Employee Details</h1>
        <div id="employee-list"> 
            <!-- Dynamic Employee Cards Will Appear Here -->
        </div>
    </div>

    <!-- Edit Employee Modal -->
 <!-- Edit Employee Modal -->
<div id="edit-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h2>Edit Employee</h2>
        <form id="edit-form">
            <!-- Hidden ID to know which employee to update -->
            <input type="hidden" name="id" id="edit-id">

            <!-- Personal Info -->
            <input type="text" name="name" id="edit-name" placeholder="Name" required pattern="[A-Za-z\s]{3,}" title="Enter a valid name (letters only)">
            <input type="text" name="phone" id="edit-phone" placeholder="Phone" required pattern="\d{10}" maxlength="10" title="Enter a 10-digit phone number">
            <input type="text" name="address" id="edit-address" placeholder="Address" required minlength="5" title="Minimum 5 characters">
            <input type="text" name="job_role" id="edit-job_role" placeholder="Job Role" required pattern="[A-Za-z\s]{3,}" title="Enter a valid job role (letters only)">

            <!-- Bank Info -->
            <h3>Bank Details</h3>
            <input type="text" name="bank_name" id="edit-bank_name" placeholder="Bank Name" required pattern="[A-Za-z\s]{3,}" title="Enter a valid bank name">
            <input type="text" name="branch" id="edit-branch" placeholder="Branch" required pattern="[A-Za-z\s]{3,}" title="Enter a valid branch">
            <input type="text" name="account_no" id="edit-account_no" placeholder="Account No" required pattern="\d{6,20}" title="6–20 digit account number">
            <input type="text" name="account_holder" id="edit-account_holder" placeholder="Account Holder" required>

            <!-- Submit -->
            <button type="submit">Save Changes</button>
            <button type="button" onclick="document.getElementById('edit-modal').style.display='none';">Cancel</button>
        </form>
    </div>
</div>


    <!-- JavaScript -->
<script>
    let employee = [];

    function fetchEmployees() {
        fetch('get_employees.php')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    employee = data.data;
                    renderEmployees();
                } else {
                    document.getElementById('employee-list').innerHTML = '<p>No Employees Found.</p>';
                }
            })
            .catch(err => {
                console.error('Fetch Error:', err);
                document.getElementById('employee-list').innerHTML = '<p>Error loading employees.</p>';
            });
    }

    // Filter employees when typing in the search box
document.getElementById('searchBox').addEventListener('input', function () {
    const query = this.value.toLowerCase();
    const filtered = employee.filter(emp => emp.name.toLowerCase().includes(query));
    renderFilteredEmployees(filtered);
});

function renderFilteredEmployees(list) {
    const container = document.getElementById('employee-list');
    container.innerHTML = '';

    if (list.length === 0) {
        container.innerHTML = '<p>No matching employees found.</p>';
        return;
    }

    list.forEach(emp => {
        container.innerHTML += `
            <div class="card">
                <h3>${emp.name}</h3>
                <p><strong>Phone:</strong> ${emp.phone}<br>
                <strong>Address:</strong> ${emp.address}<br>
                <strong>Job Role:</strong> ${emp.job_role}</p>
                <h4>Bank Details</h4>
                <p><strong>Bank Name:</strong> ${emp.bank_name}<br>
                <strong>Branch:</strong> ${emp.branch}<br>
                <strong>Account No:</strong> ${emp.account_no}<br>
                <strong>Account Holder:</strong> ${emp.account_holder}</p>
                <div class="button-group">
                    <button onclick="editEmployee(${emp.id})">Edit</button>
                    <button onclick="deleteEmployee(${emp.id})">Delete</button>
                </div>
            </div>
        `;
    });
}


    function renderEmployees() {
        const container = document.getElementById('employee-list');
        container.innerHTML = '';

        employee.forEach(emp => {
            container.innerHTML += `
                <div class="card">
                    <h3>${emp.name}</h3>
                    <p><strong>Phone:</strong> ${emp.phone}<br>
                    <strong>Address:</strong> ${emp.address}<br>
                    <strong>Job Role:</strong> ${emp.job_role}</p>
                    <h4>Bank Details</h4>
                    <p><strong>Bank Name:</strong> ${emp.bank_name}<br>
                    <strong>Branch:</strong> ${emp.branch}<br>
                    <strong>Account No:</strong> ${emp.account_no}<br>
                    <strong>Account Holder:</strong> ${emp.account_holder}</p>
                    <div class="button-group">
                        <button onclick="editEmployee(${emp.id})">Edit</button>
                        <button onclick="deleteEmployee(${emp.id})">Delete</button>
                    </div>
                </div>
            `;
        });
    }

    function editEmployee(id) {
        const emp = employee.find(e => e.id == id);
        if (!emp) return;

        // Fill form with existing data
        document.getElementById('edit-id').value = emp.id;
        document.getElementById('edit-name').value = emp.name;
        document.getElementById('edit-phone').value = emp.phone;
        document.getElementById('edit-address').value = emp.address;
        document.getElementById('edit-job_role').value = emp.job_role;
        document.getElementById('edit-bank_name').value = emp.bank_name;
        document.getElementById('edit-branch').value = emp.branch;
        document.getElementById('edit-account_no').value = emp.account_no;
        document.getElementById('edit-account_holder').value = emp.account_holder;

        // Show modal
        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    // Submit form with updated data
    document.getElementById('edit-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        fetch('update_employee.php', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert('Employee updated successfully!');
                closeModal();
                fetchEmployees();
            } else {
                alert('Update failed: ' + data.message);
            }
        });
    });

    function deleteEmployee(id) {
        if (!confirm('Are you sure you want to delete this employee?')) return;

        fetch('delete_employee.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert('Employee deleted.');
                fetchEmployees();
            } else {
                alert('Delete failed: ' + data.message);
            }
        });
    }

    // Load data when page loads
    fetchEmployees();
</script>



</body>
</html>
