<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products Report</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  <link rel="stylesheet" href="report.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* body { background: #1c1c1c; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; } */
    /* Sidebar */
    .sidebar {
      width: 220px;
      height: 100vh;

      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;

      padding-top: 40px;

    }
    .sidebar a {
      color: #ccc;
      padding: 15px 25px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      font-size: 16px;
      border-left: 4px solid transparent;
    }
    .sidebar a.active {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      font-weight: bold;
      border-left: 4px solid #fff;
    }
    .sidebar a:hover:not(.active) {
      background-color: #3a3a3a;
      color: #fff;
      border-left: 4px solid #ff416c;
    }
    /* Content */
    main.container {
      margin-left: 220px; /* Push content to the right of sidebar */
      padding: 40px;
      width: calc(100% - 220px);
    }
    /* .topbar {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }
    .topbar a.back-btn {
      color: #ccc;
      text-decoration: none;
      margin-bottom: 5px;
    }
    .topbar-title {
      font-size: 28px;
      color: #ff416c;
    } */
    .filter-select, .filter-input { margin-right: 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #121212; color: #fff; }
    .export-buttons button { margin-left: 5px; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; }
    .export-buttons .btn-excel { background-color: #22c55e; color: #fff; }
    .export-buttons .btn-pdf { background-color: #ef4444; color: #fff; }
    .grid { display: grid; gap: 1.5rem; }
    .summary-card { padding: 20px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 16px; }
    .summary-card.green { background: #22c55e; }
    .summary-card.red { background: #ef4444; }
    .summary-card.blue { background: #3b82f6; }
    .chart-card { background: #2a2a2a; padding: 15px; border-radius: 12px; }
    table.styled-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
    table.styled-table th, table.styled-table td { border: 1px solid #444; padding: 10px; }
    table.styled-table th { background: #2c2c2c; color: #ff416c; }
    .row-full { background: #134e4a; }
    .row-advance { background: #78350f; }
    .row-unpaid { background: #7f1d1d; }
  </style> 
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="create_product.html"><i class="fas fa-plus-circle"></i> Create Product</a>
    <a href="product.php"><i class="fas fa-chart-line"></i> Products</a>
    <a href="report.html" class="active"><i class="fas fa-file-alt"></i> Reports</a>
      <a href="admin.html" class="dashboard-btn"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
  </div>

  <!-- Main Content -->
  <main class="container mx-auto px-6 py-8">

    <!-- Top Navigation -->
    <header class="topbar">
      <a href="admin.html" class="back-btn">← Dashboard</a>
      <a href="product.php" class="back-btn">← Product Page</a>
      <h1 class="topbar-title">📊 Products Report</h1>
    </header>
    <br>
    <br>

    <!-- Filters & Export -->
    <div class="toolbar mb-6">
      <select id="filterType" class="filter-select">
        <option value="all">All</option>
        <option value="month">Monthly</option>
        <option value="year">Yearly</option>
      </select>
      <input type="month" id="monthPicker" class="filter-input hidden" />
      <input type="number" id="yearPicker" min="2000" max="2099" step="1" class="filter-input hidden" placeholder="Enter Year" />

      <select id="paymentFilter" class="filter-select">
        <option value="all">All Payments</option>
        <option value="full">Full Paid</option>
        <option value="advance">Advance Paid</option>
        <option value="unpaid">Unpaid</option>
      </select>

      <div class="export-buttons inline-block">
        <button onclick="exportToExcel()" class="btn-excel">⬇️ Excel</button>
        <button onclick="exportToPDF()" class="btn-pdf">⬇️ PDF</button>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
      <div class="summary-card green" id="client">Clients</div>
      <div class="summary-card red" id="totalproducts">Products</div>
      <div class="summary-card blue" id="totalprice">Total Price</div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="chart-card">
        <canvas id="profitChart"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="paymentPieChart"></canvas>
      </div>
    </div>

    <!-- Products Table -->
    <div class="table-container">
      <table id="reportTable" class="styled-table">
        <thead>
          <tr>
            <th>Product Number</th>
            <th>Product Name</th>
            <th>Client</th>
            <th>Sizes</th>
            <th>Quantity</th>
            <th>Price per Item</th>
            <th>Total Price</th>
            <th>Payment</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="reportTableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    // Your existing JS for filters, chart rendering, and exporting
    let client = 0, totalproducts = 0, totalprice = 0;
    let chart, pieChart;

    document.getElementById("filterType").addEventListener("change", function () {
      document.getElementById("monthPicker").classList.add("hidden");
      document.getElementById("yearPicker").classList.add("hidden");
      if (this.value === "month") document.getElementById("monthPicker").classList.remove("hidden");
      else if (this.value === "year") document.getElementById("yearPicker").classList.remove("hidden");
      loadReportData();
    });

    document.getElementById("monthPicker").addEventListener("change", loadReportData);
    document.getElementById("yearPicker").addEventListener("input", loadReportData);
    document.getElementById("paymentFilter").addEventListener("change", loadReportData);

    async function loadReportData() {
      client = 0; totalproducts = 0; totalprice = 0;

      try {
        const res = await fetch("get_product.php");
        const orders = await res.json();
        const tableBody = document.getElementById("reportTableBody");
        tableBody.innerHTML = "";

        const filterType = document.getElementById("filterType").value;
        const monthVal = document.getElementById("monthPicker").value;
        const yearVal = document.getElementById("yearPicker").value;
        const paymentFilter = document.getElementById("paymentFilter").value;

        const filteredOrders = orders.filter(order => {
          const orderDate = new Date(order.created_at);

          if (filterType === "month" && monthVal) {
            const [year, month] = monthVal.split("-");
            if (!(orderDate.getFullYear() == year && (orderDate.getMonth() + 1) == month)) return false;
          }
          if (filterType === "year" && yearVal) {
            if (orderDate.getFullYear() != yearVal) return false;
          }

          if (paymentFilter !== "all") {
            if (paymentFilter === "full" && order.fully_paid != 1) return false;
            if (paymentFilter === "advance" && !(order.advance > 0 && order.fully_paid != 1)) return false;
            if (paymentFilter === "unpaid" && (order.fully_paid == 1 || order.advance > 0)) return false;
          }
          return true;
        });

        let paymentStats = { full: 0, advance: 0, unpaid: 0 };

        filteredOrders.forEach(order => {
          totalproducts += parseInt(order.quantity);
          totalprice += Number(order.total_price) || 0;
          client += 1;

          let paymentStatus = order.fully_paid == 1 ? "full" : (order.advance > 0 ? "advance" : "unpaid");
          paymentStats[paymentStatus]++;

          const row = document.createElement("tr");
          row.classList.add(
            paymentStatus === "full" ? "row-full" :
            paymentStatus === "advance" ? "row-advance" : "row-unpaid"
          );
          row.innerHTML = `
            <td>${order.product_number}</td>
            <td>${order.product_name}</td>
            <td>${order.client}</td>
            <td>${order.size}</td>
            <td>${order.quantity}</td>
            <td>${order.price}</td>
            <td>${order.total_price}</td>
            <td>${paymentStatus === "full" ? "Full Paid" : (paymentStatus === "advance" ? "Advance Paid" : "Unpaid")}</td>
            <td>${order.created_at}</td>
          `;
          tableBody.appendChild(row);
        });

        document.getElementById("client").textContent = "Clients: " + client;
        document.getElementById("totalproducts").textContent = "Products: " + totalproducts;
        document.getElementById("totalprice").textContent = "Total Price: " + totalprice;

        renderCharts(paymentStats);

      } catch (err) {
        console.error("Failed to load report data", err);
      }
    }

    function renderCharts(paymentStats) {
      const ctx = document.getElementById("profitChart").getContext("2d");
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Clients", "Total Products", "Total Price"],
          datasets: [{ data: [client, totalproducts, totalprice], backgroundColor: ["#4ade80", "#f87171", "#60a5fa"] }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
      });

      const pieCtx = document.getElementById("paymentPieChart").getContext("2d");
      if (pieChart) pieChart.destroy();
      pieChart = new Chart(pieCtx, {
        type: "pie",
        data: {
          labels: ["Full Paid", "Advance Paid", "Unpaid"],
          datasets: [{ data: [paymentStats.full, paymentStats.advance, paymentStats.unpaid], backgroundColor: ["#22c55e", "#eab308", "#ef4444"] }]
        }
      });
    }

    function exportToExcel() {
      const table = document.getElementById("reportTable");
      const workbook = XLSX.utils.table_to_book(table, { sheet: "Report" });
      XLSX.writeFile(workbook, "Products.xlsx");
    }

    async function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Products Report", 10, 15);

      const chartCanvas = document.getElementById("profitChart");
      if (chartCanvas) {
        const chartImage = chartCanvas.toDataURL("image/png", 1.0);
        doc.addImage(chartImage, "PNG", 10, 25, 180, 80);
      }

      const pieCanvas = document.getElementById("paymentPieChart");
      if (pieCanvas) {
        const pieImage = pieCanvas.toDataURL("image/png", 1.0);
        doc.addImage(pieImage, "PNG", 10, 110, 120, 80);
      }

      const table = document.getElementById("reportTable");
      const rows = Array.from(table.querySelectorAll("tbody tr")).map(row =>
        Array.from(row.querySelectorAll("td")).map(cell => cell.textContent.trim())
      );
      const headers = Array.from(table.querySelectorAll("thead th")).map(th => th.textContent.trim());

      doc.autoTable({ head: [headers], body: rows, startY: 200 });
      doc.save("Products.pdf");
    }

    window.onload = loadReportData;
  </script>
</body>
</html>
