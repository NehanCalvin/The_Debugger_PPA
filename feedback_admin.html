 <div class="header-row">

<input type="text" id="customerEmail" placeholder="Enter customer email" style="margin: 20px;">
<button onclick="sendEmail()">Send Feedback Request</button>

    <!-- Feedback cards will be inserted here -->

<!-- Edit Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeEditModal()">&times;</span> 
    <h2>Edit Feedback</h2>
    <form id="editForm">
      <input type="hidden" id="editId" />
      <label>Name:</label>
      <input type="text" id="editName" required />
      <label>Product:</label>
      <input type="text" id="editProduct" required />
      <label>Rating:</label>
      <input type="number" id="editRating" min="1" max="5" required />
      <label>Comment:</label>
      <textarea id="editComment" rows="4" required></textarea>
      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>
<noscript><style>#editModal { display: none !important; }</style></noscript>


<script>document.getElementById("searchBox").addEventListener("input", function () {
    let searchValue = this.value.toLowerCase();
    let cards = document.querySelectorAll(".feedback-card");

    cards.forEach(card => {
        let cardText = card.innerText.toLowerCase();
        if (cardText.includes(searchValue)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
});
</script>


<script>
function sendEmail() {
    const email = document.getElementById("customerEmail").value;

    // Send request to PHP
    fetch("send_feedback_email.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "email=" + encodeURIComponent(email)
    })
    .then(response => response.text())
    .then(data => {
        // Show PHP response as alert
        alert(data);
    })
    .catch(error => {
        alert("❌ Error sending request: " + error);
    });
}
</script>

</body>
