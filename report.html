<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order & Sales Report</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e1e;
      color: #f0f0f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 220px;
      height: 100vh;
      background: #2c2c2c;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 40px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.6);
    }
    .sidebar a {
      color: #ccc;
      padding: 15px 25px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      font-size: 16px;
      border-left: 4px solid transparent;
    }
    .sidebar a.active {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      font-weight: bold;
      border-left: 4px solid #fff;
    }
    .sidebar a:hover:not(.active) {
      background-color: #3a3a3a;
      color: #fff;
      border-left: 4px solid #ff416c;
    }
    .main-content {
      margin-left: 220px;
      padding: 24px;
      overflow-y: auto;
      width: calc(100% - 220px);
      height: 100vh;
    }
    .main-content::-webkit-scrollbar {
      width: 8px;
    }
    .main-content::-webkit-scrollbar-thumb {
      background-color: #555;
      border-radius: 4px;
    }
    th.sortable {
      cursor: pointer;
    }
    th.sortable:hover {
      background-color: #444;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="orders.html"><i class="fas fa-plus-circle"></i> Create Order</a>
    <a href="order&sales.html"><i class="fas fa-chart-line"></i> Orders & Sales</a>
    <a href="report.html"class="active"><i class="fas fa-file-alt"></i> Reports</a>
    <a href="admin.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <h1 class="text-3xl font-bold mb-6">📄 Order & Sales Report</h1>

    <!-- Filter Controls -->
    <div class="flex flex-wrap items-center gap-4 mb-6">
      <select id="filterType" class="border rounded px-4 py-2 text-black">
        <option value="all">All</option>
        <option value="month">Monthly</option>
        <option value="year">Yearly</option>
      </select>
      <input type="month" id="monthPicker" class="border rounded px-4 py-2 text-black hidden" />
      <input type="number" id="yearPicker" min="2000" max="2099" step="1" class="border rounded px-4 py-2 text-black hidden" placeholder="Enter Year" />

      <!-- Date Range -->
      <label class="ml-4">From: <input type="date" id="startDate" class="border rounded px-2 py-1 text-black"></label>
      <label>To: <input type="date" id="endDate" class="border rounded px-2 py-1 text-black"></label>

      <!-- Search -->
      <input type="text" id="searchBox" placeholder="🔍 Search..." class="border rounded px-4 py-2 text-black flex-grow max-w-xs" />

      <div class="flex-grow"></div>

      <button onclick="exportToExcel()" class="bg-green-500 text-white px-4 py-2 rounded">Export to Excel</button>
      <button onclick="exportToPDF()" class="bg-red-500 text-white px-4 py-2 rounded">Export to PDF</button>
    </div>

    <!-- REPORT CONTAINER -->
    <div id="report-container">
      <!-- Summary Cards -->
      <div class="flex flex-wrap gap-4 mb-6 justify-center">
        <div class="bg-green-900 p-4 rounded shadow text-lg text-white" id="incomeCard">💰 Total Income: LKR 0</div>
        <div class="bg-red-900 p-4 rounded shadow text-lg text-white" id="expenseCard">📉 Total Cost: LKR 0</div>
        <div class="bg-blue-900 p-4 rounded shadow text-lg text-white" id="profitCard">📈 Profit: LKR 0</div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <!-- Bar Chart -->
        <div class="bg-gray-900 p-4 rounded shadow h-72">
          <canvas id="profitChart"></canvas>
        </div>
        <!-- Ribbon (Line) Chart -->
        <div class="bg-gray-900 p-4 rounded shadow h-72">
          <canvas id="ribbonChart"></canvas>
        </div>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table id="reportTable" class="min-w-full bg-gray-900 text-gray-100 shadow rounded-lg">
          <thead class="bg-gray-800">
            <tr>
              <th class="py-2 px-4 text-left sortable" data-col="invoice">Invoice</th>
              <th class="py-2 px-4 text-left sortable" data-col="company">Company</th>
              <th class="py-2 px-4 text-left sortable" data-col="client">Client</th>
              <th class="py-2 px-4 text-left sortable" data-col="phone">Phone</th>
              <th class="py-2 px-4 text-left sortable" data-col="quantity">Quantity</th>
              <th class="py-2 px-4 text-left sortable" data-col="cost">Cost (LKR)</th>
              <th class="py-2 px-4 text-left sortable" data-col="selling">Selling (LKR)</th>
              <th class="py-2 px-4 text-left sortable" data-col="profit">Profit (LKR)</th>
              <th class="py-2 px-4 text-left">Status</th>
            </tr>
          </thead>
          <tbody id="reportTableBody"></tbody>
        </table>
      </div>
    </div>
    <!-- END REPORT CONTAINER -->
  </div>

  <script>
    let totalIncome = 0, totalCost = 0, totalProfit = 0;
    let chart, ribbonChart, allOrders = [], currentSort = { col: null, asc: true };

    document.getElementById("filterType").addEventListener("change", function () {
      document.getElementById("monthPicker").classList.add("hidden");
      document.getElementById("yearPicker").classList.add("hidden");
      if (this.value === "month") document.getElementById("monthPicker").classList.remove("hidden");
      else if (this.value === "year") document.getElementById("yearPicker").classList.remove("hidden");
      loadReportData();
    });

    ["monthPicker","yearPicker","startDate","endDate","searchBox"].forEach(id=>{
      document.getElementById(id).addEventListener("input", loadReportData);
    });

    document.querySelectorAll("th.sortable").forEach(th=>{
      th.addEventListener("click", ()=>{
        const col = th.dataset.col;
        currentSort.asc = (currentSort.col === col) ? !currentSort.asc : true;
        currentSort.col = col;
        renderTable(allOrders);
      });
    });

    async function loadReportData() {
      totalIncome = totalCost = totalProfit = 0;
      try {
        const res = await fetch('fetch_orders.php');
        const orders = await res.json();
        allOrders = orders;
        renderTable(allOrders);
      } catch (err) { console.error("Failed to load report data", err); }
    }

    function renderTable(orders) {
      const tableBody = document.getElementById("reportTableBody");
      tableBody.innerHTML = "";

      const filterType = document.getElementById("filterType").value;
      const monthVal = document.getElementById("monthPicker").value;
      const yearVal = document.getElementById("yearPicker").value;
      const startDate = document.getElementById("startDate").value ? new Date(document.getElementById("startDate").value) : null;
      const endDate = document.getElementById("endDate").value ? new Date(document.getElementById("endDate").value) : null;
      const query = document.getElementById("searchBox").value.toLowerCase();

      let filtered = orders.filter(order=>{
        const orderDate = new Date(order.created_at);
        if (filterType === "month" && monthVal) {
          const [year, month] = monthVal.split("-");
          if (!(orderDate.getFullYear() == year && orderDate.getMonth()+1 == month)) return false;
        }
        if (filterType === "year" && yearVal && orderDate.getFullYear() != yearVal) return false;
        if (startDate && orderDate < startDate) return false;
        if (endDate && orderDate > endDate) return false;

        if (query) {
          const str = Object.values(order).join(" ").toLowerCase();
          if (!str.includes(query)) return false;
        }
        return true;
      });

      if (currentSort.col) {
        filtered.sort((a,b)=>{
          let valA, valB;
          if(currentSort.col==="selling") { valA=a.selling_price*a.quantity; valB=b.selling_price*b.quantity; }
          else if(currentSort.col==="profit") { valA=parseFloat(a.profit); valB=parseFloat(b.profit); }
          else valA=a[currentSort.col], valB=b[currentSort.col];
          return currentSort.asc ? (valA>valB?1:-1) : (valA<valB?1:-1);
        });
      }

      filtered.forEach(order=>{
        const sellingTotal = order.selling_price * order.quantity;
        const profit = parseFloat(order.profit);
        totalIncome += sellingTotal;
        totalCost += parseFloat(order.cost);
        totalProfit += profit;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="py-2 px-4">${order.invoice}</td>
          <td class="py-2 px-4">${order.company}</td>
          <td class="py-2 px-4">${order.client}</td>
          <td class="py-2 px-4">${order.phone}</td>
          <td class="py-2 px-4">${order.quantity}</td>
          <td class="py-2 px-4">${order.cost}</td>
          <td class="py-2 px-4">${sellingTotal.toFixed(2)}</td>
          <td class="py-2 px-4 ${profit >= 0 ? 'text-green-600' : 'text-red-600'}">${profit}</td>
          <td class="py-2 px-4">${order.full_paid == 1 ? 'Full Paid' : order.advanced_paid == 1 ? 'Advance Paid' : 'Unpaid'}</td>
        `;
        tableBody.appendChild(row);
      });

      document.getElementById("incomeCard").textContent = `💰 Total Income: LKR ${totalIncome.toLocaleString()}`;
      document.getElementById("expenseCard").textContent = `📉 Total Cost: LKR ${totalCost.toLocaleString()}`;
      document.getElementById("profitCard").textContent = `📈 Profit: LKR ${totalProfit.toLocaleString()}`;

      renderChart();
      renderRibbonChart();
    }

    function renderChart() {
      const ctx = document.getElementById("profitChart").getContext("2d");
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Total Income", "Total Cost", "Profit"],
          datasets: [{
            label: "LKR",
            data: [totalIncome, totalCost, totalProfit],
            backgroundColor: ["#4ade80", "#f87171", "#60a5fa"],
            borderRadius: 10,
            borderWidth: 1,
            borderColor: "#fff"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: 0 },
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: "rgba(255,255,255,0.3)" }, ticks:{ color:"#f0f0f0" }},
            x: { grid: { color: "rgba(255,255,255,0.3)" }, ticks:{ color:"#f0f0f0" }}
          }
        }
      });
    }

    // function renderRibbonChart() {
    //   const ctx = document.getElementById("ribbonChart").getContext("2d");
    //   if (ribbonChart) ribbonChart.destroy();
    //   ribbonChart = new Chart(ctx, {

    function renderRibbonChart() {
  const ctx = document.getElementById("ribbonChart").getContext("2d");
  if (ribbonChart) ribbonChart.destroy();

  ribbonChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: ["January", "February", "March", "April", "May", "June", "July"], // example months
      datasets: [
        {
          label: "Income",
          data: [totalIncome*0.9, totalIncome*1, totalIncome*1.1, totalIncome*0.95, totalIncome, totalIncome*1.05, totalIncome],
          fill: true,
          backgroundColor: "rgba(59, 130, 246, 0.3)", // blue ribbon
          borderColor: "#3b82f6",
          tension: 0.4,
          borderWidth: 3,
          pointRadius: 0
        },
        {
          label: "Cost",
          data: [totalCost*1.05, totalCost*0.95, totalCost, totalCost*1.1, totalCost*0.9, totalCost*1.05, totalCost],
          fill: true,
          backgroundColor: "rgba(239, 68, 68, 0.3)", // red ribbon
          borderColor: "#ef4444",
          tension: 0.4,
          borderWidth: 3,
          pointRadius: 0
        },
        {
          label: "Profit",
          data: [totalProfit, totalProfit*1.1, totalProfit*0.9, totalProfit*1, totalProfit*1.05, totalProfit*0.95, totalProfit],
          fill: true,
          backgroundColor: "rgba(34,197,94,0.3)", // green ribbon 
          borderColor: "#22c55e",
          tension: 0.4,
          borderWidth: 3,
          pointRadius: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: "#f0f0f0" } }
      },
      scales: {
        y: { beginAtZero: true, grid: { color: "rgba(255,255,255,0.2)" }, ticks:{ color:"#f0f0f0" }},
        x: { grid: { color: "rgba(255,255,255,0.1)" }, ticks:{ color:"#f0f0f0" }}
      }
    }
  });
}


    async function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF("p", "mm", "a4");
      const reportElement = document.getElementById("report-container");
      const canvas = await html2canvas(reportElement, { scale: 2, useCORS: true });
      const imgData = canvas.toDataURL("image/png");
      const imgProps = doc.getImageProperties(imgData);
      const pdfWidth = doc.internal.pageSize.getWidth() - 20;
      const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
      doc.addImage(imgData, "PNG", 10, 10, pdfWidth, pdfHeight);
      doc.save("Order_Sales_Report.pdf");
    }

    function exportToExcel() {
      const table = document.getElementById("reportTable");
      const wb = XLSX.utils.table_to_book(table, { sheet: "Orders" });
      XLSX.writeFile(wb, "Order_Sales_Report.xlsx");
    }

    window.onload = loadReportData;
  </script>
